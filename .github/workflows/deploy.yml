name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    uses: ./.github/workflows/lint-fmt.yml

  deploy:
    name: Trigger Vercel deploy hook
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Add the VERCEL_DEPLOY_HOOK_URL repository secret before deploying."
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --output /dev/null \
            "$VERCEL_DEPLOY_HOOK_URL"

          echo "Deployment requested. Check the Vercel dashboard for the build result."
